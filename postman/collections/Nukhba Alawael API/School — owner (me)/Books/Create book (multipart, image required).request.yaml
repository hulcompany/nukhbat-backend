$kind: http-request
name: Create book (multipart, image required)
url: "{{baseUrl}}/api/books/school"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: name
      value: Book Name
      disabled: false
    - type: file
      key: image
      src:
        - /E:/cv.pdf
      disabled: false
order: 2000
